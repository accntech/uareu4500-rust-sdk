[package]
name = "uareu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "UareU Rust SDK: experimental Windows, Linux and macOS USB fingerprint capture"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
futures-core = { version = "0.3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
nusb = "0.2.9"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.10"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uareu"
path = "src/main.rs"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"
