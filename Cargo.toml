[package]
name = "uareu4500"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "UareU 4500 Rust SDK: experimental Linux and macOS USB fingerprint capture"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
getrandom = { version = "0.3", features = ["std"] }
nusb = "0.2.9"
png = "0.18"

[lib]
path = "src/lib.rs"

[[bin]]
name = "uareu4500"
path = "src/main.rs"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"
