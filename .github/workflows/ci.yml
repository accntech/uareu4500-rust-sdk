name: Rust
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo xtask notices
      - run: cargo xtask notices --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked -p uareu --no-default-features --all-targets
      - run: cargo xtask fixtures --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --release
      - name: Verify macOS native library loading
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-dylib.py target/release/libuareu.dylib
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Verify Windows DLL from C and C#
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-dll.ps1
      - name: Verify reader harness without hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-reader-acceptance.ps1 -SelfTest
      - name: Verify experimental Windows source inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-sdk.ps1 -SelfTest
